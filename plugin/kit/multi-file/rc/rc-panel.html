<section id="rc" aria-live="polite" data-s="off" data-collapsed="false">
  <header class="rc-head">
    <span class="rc-dot" aria-hidden="true"></span>
    <h2>Claude remote control</h2>
    <span id="rc-state" class="rc-pill" data-s="off">starting...</span>
    <span id="rc-mini" class="rc-mini"></span>
    <button id="rc-toggle" class="rc-toggle" type="button" aria-expanded="true" aria-label="Collapse or expand the panel">&#9662;</button>
  </header>
  <div class="rc-body">
    <div class="rc-grid">
      <div class="rc-k">Session</div><div><span id="rc-lock" data-s="free">free</span></div>
      <div class="rc-k">Control</div><div><label class="rc-pause" for="rc-pause"><input id="rc-pause" type="checkbox"> <span>Pause (hold new commands)</span></label></div>
    </div>
    <div id="rc-detail" class="rc-detail"></div>
    <div class="rc-sub">Logs</div>
    <ol id="rc-log" class="rc-log" tabindex="0" aria-label="Recent activity"></ol>
    <div class="rc-note">Private channel: only you, from your own Claude session, can drive this page. Results and screenshots stay in your private area.</div>
  </div>
</section>
