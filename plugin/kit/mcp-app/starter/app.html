<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Relay starter</title>
<style>
  * { box-sizing: border-box; }
  /* The Relay panel (rc-panel.css) reads these tokens from your page: --panel --fg --muted --line --ok --warn --err. */
  :root { --bg: #ffffff; --panel: #fafafa; --fg: #1a1a1a; --muted: #5f5f5f; --field: #f1f1f1; --line: #b5b5b5; --ok: #0a7d3e; --warn: #a35200; --err: #c4182d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --panel: #1b1b1b; --fg: #f2f2f2; --muted: #a8a8a8; --field: #3d3d3d; --line: #6a6a6a; --ok: #4cc38a; --warn: #e0a458; --err: #ff7b86; } }
  body { margin: 0; padding: 16px; color: var(--fg); background: var(--bg); font: 15px system-ui, sans-serif; }
  main { max-width: 32rem; margin-inline: auto; }
  label, form { display: grid; gap: 8px; }
  input, button { font: inherit; padding: 8px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 4px; }
  output { display: block; min-height: 2em; margin-top: 12px; font-weight: 600; }
</style>
</head>
<body>
<!-- Everything Claude should read or operate lives inside #app, and every control has an id. -->
<main id="app">
  <h1>Relay starter</h1>
  <form id="greeter">
    <label>Your name <input id="name" autocomplete="off" required></label>
    <div><button id="greet" type="submit" disabled>Greet</button></div>
  </form>
  <output id="greeting" aria-live="polite"></output>
</main>
<!-- RELAY_PANEL -->
<!-- RELAY_SCRIPTS -->
</body>
</html>
